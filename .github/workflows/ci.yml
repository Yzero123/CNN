name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 最低 3.11：随仓库提供的 Keras 2 权重需 keras>=3.15.0 才能反序列化
        # （GlorotUniform 的 input_axes 兼容自 3.15.0 才存在），而 keras>=3.13
        # 的 requires_python 为 >=3.11，Python 3.10 最高只能装到 keras 3.12.4。
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装 OpenCV 所需的系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0t64 || sudo apt-get install -y libgl1 libglib2.0-0

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m py_compile 3cl_train.py predict.py evaluate.py

      - name: 评估随仓库提供的模型
        run: python evaluate.py

      - name: 单图预测冒烟测试
        run: python predict.py img_test/dog/1001.jpg
